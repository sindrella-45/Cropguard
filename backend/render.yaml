services:
  - type: web
    name: cropguard-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install uv && uv sync
    startCommand: uv run uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: LANGCHAIN_TRACING_V2
        value: false
      - key: RAG_SIMILARITY_THRESHOLD
        value: "0.35"